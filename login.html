<!DOCTYPE html>
<html>
  <head>
    <title>Annoture – Sign In</title>
    <meta charset="utf-8">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        width: 300px;
        background-color: #141414;
        color: #fff;
        padding: 24px;
        font-size: 14px;
        /* subtle grid pattern */
        background-image:
          linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      /* ── Header ─────────────────────────────────────── */
      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
      }

      .logo {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: linear-gradient(135deg, #8B5CF6, #6366F1);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .logo svg {
        width: 14px;
        height: 14px;
      }

      h1 {
        font-size: 17px;
        font-weight: 600;
        color: #fff;
        letter-spacing: -0.3px;
      }

      /* ── Field rows (label | input) ─────────────────── */
      .field-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      .field-label {
        width: 68px;
        flex-shrink: 0;
        font-size: 13px;
        color: rgba(255,255,255,0.45);
      }

      .field-input {
        flex: 1;
        background: #1f1f1f;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 13px;
        color: #fff;
        outline: none;
        transition: border-color 0.2s;
        width: 100%;
        font-family: inherit;
      }

      .field-input::placeholder {
        color: rgba(255,255,255,0.2);
      }

      .field-input:focus {
        border-color: rgba(139, 92, 246, 0.6);
        background: #222;
      }

      /* ── Divider ─────────────────────────────────────── */
      .divider {
        height: 1px;
        background: rgba(255,255,255,0.06);
        margin: 16px 0;
      }

      /* ── Submit button ───────────────────────────────── */
      .submit-btn {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 50px;
        background: linear-gradient(135deg, #7C3AED, #6366F1);
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
        letter-spacing: 0.1px;
        font-family: inherit;
        box-shadow: 0 4px 20px rgba(109, 86, 240, 0.35);
      }

      .submit-btn:hover  { opacity: 0.9; }
      .submit-btn:active { transform: scale(0.98); }

      .submit-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        transform: none;
      }

      /* ── Spinner ─────────────────────────────────────── */
      .submit-btn .btn-spinner {
        display: none;
        width: 15px;
        height: 15px;
        animation: spin 0.75s linear infinite;
      }

      .submit-btn.loading .btn-text    { display: none; }
      .submit-btn.loading .btn-spinner { display: inline-block; }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* ── Error message ───────────────────────────────── */
      #error {
        font-size: 12px;
        color: #f87171;
        margin-top: 10px;
        min-height: 16px;
        text-align: center;
      }

      /* ── Register link ───────────────────────────────── */
      .register {
        margin-top: 14px;
        text-align: center;
      }

      .register button {
        background: transparent;
        border: none;
        font-size: 12px;
        color: rgba(255,255,255,0.35);
        cursor: pointer;
        transition: color 0.2s;
        font-family: inherit;
      }

      .register button span {
        color: #8B5CF6;
      }

      .register button:hover span {
        color: #a78bfa;
      }
    </style>
  </head>
  <body>

    <!-- Header -->
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10.656V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.344"/>
          <path d="m9 11 3 3L22 4"/>
        </svg>
      </div>
      <h1>Sign In</h1>
    </div>

    <!-- Login form -->
    <form id="login-form">
      <div class="field-row">
        <span class="field-label">Email</span>
        <input
          id="email"
          type="email"
          class="field-input"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="field-row">
        <span class="field-label">Password</span>
        <input
          id="password"
          type="password"
          class="field-input"
          placeholder="••••••••"
          required
        />
      </div>

      <div class="divider"></div>

      <button type="submit" class="submit-btn">
        <span class="btn-text">Log In</span>
        <svg class="btn-spinner" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="31.4 31.4" />
        </svg>
      </button>
    </form>

    <p id="error"></p>

    <div class="register">
      <button type="button">
        No account? <span>Sign up →</span>
      </button>
    </div>

    <script src="login.js"></script>
  </body>
</html>
